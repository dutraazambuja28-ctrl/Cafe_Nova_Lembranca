{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CafeteriaNovaLembranca{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'CafeNL/css/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
</head>

<body class="d-flex flex-column min-vh-100" style="background-color: #350a06 !important; color: #f8f9fa;">

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a href="{% url 'CafeNL:cardapio_list' %}" class="navbar-brand fw-bold">Cafeteria Nova Lembrança</a>
            <span class="navbar-text text-light">
                Olá, {% if user.is_authenticated %}{{ user.username }}{% else %}Visitante{% endif %}
            </span>
        </div>
    </nav>

    <div class="container-fluid flex-grow-1 d-flex flex-column px-0">
        <div class="row flex-grow-1 g-0">
            
            <aside class="col-md-3 col-lg-2 py-4 border-end border-secondary" style="background-color: #2b0805 !important;">
                <ul class="nav flex-column px-3">
                    <li class="nav-item mb-2">
                        <a href="{% url 'CafeNL:cardapio_list' %}" class="nav-link text-light">Cardápio</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'admin:index' %}" class="nav-link text-light">Admin</a>
                    </li>
                </ul>
            </aside>

            <main class="col-md-9 col-lg-10 p-4 text-light">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <footer class="bg-dark text-white-50 text-center py-3 border-top border-secondary mt-auto">
        <small>&copy; {% now "Y" %} Cafeteria Nova Lembrança</small>
    </footer>

</body>

</html>
